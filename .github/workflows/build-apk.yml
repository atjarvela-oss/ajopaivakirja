name: Rakenna Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Hae koodikanta
        uses: actions/checkout@v4

      - name: Asenna Node.js (Node 22 vaaditaan Capacitor CLI:lle)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Asenna Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Asenna riippuvuudet
        run: npm ci

      - name: Rakenna web-sovellus ja synkronoi Androidiin
        run: npm run android:sync

      - name: Anna suoritusoikeus gradlew:lle
        run: chmod +x android/gradlew

      - name: Käännä debug APK
        run: |
          rm -f android/local.properties
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Tallenna virheraportit jos käännös epäonnistuu
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-reports
          path: |
            android/app/build/reports/
          retention-days: 7

      - name: Kopioi APK pääkansioon
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ajopaivakirja.apk

      - name: Tallenna APK latausartefaktina
        uses: actions/upload-artifact@v4
        with:
          name: ajopaivakirja-apk
          path: ajopaivakirja.apk
          retention-days: 30

      - name: Selvitä sovelluksen versio
        id: app_info
        run: |
          VERSION=$(node -p "try { require('./version.json').version } catch(e) { '1.0.0' }")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Luo tai päivitä GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app_info.outputs.tag }}
          name: Versio ${{ steps.app_info.outputs.version }}
          files: ajopaivakirja.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
