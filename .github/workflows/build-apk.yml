name: Rakenna Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Hae koodikanta
        uses: actions/checkout@v4

      - name: Asenna Node.js (Node 22 vaaditaan Capacitor CLI:lle)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Asenna Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Asenna riippuvuudet
        run: npm ci

      - name: Rakenna web-sovellus ja synkronoi Androidiin
        run: npm run android:sync

      - name: Anna suoritusoikeus gradlew:lle
        run: chmod +x android/gradlew

      - name: Käännä debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Kopioi APK pääkansioon
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ajopaivakirja.apk

      - name: Tallenna APK latausartefaktina
        uses: actions/upload-artifact@v4
        with:
          name: ajopaivakirja-apk
          path: ajopaivakirja.apk
          retention-days: 30

      - name: Luo GitHub Release (jos git tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ajopaivakirja.apk
          name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
